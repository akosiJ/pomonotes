<!-- login.component.html -->
<div class="flex items-center h-screen">
  <p-card class="w-full max-w-sm mx-auto">
    <div class="flex flex-col items-center py-6">
      <span class="pi pi-sign-in" style="font-size: 2.5rem"></span>
      <h2 class="text-xl font-bold text-center mb-4">Login to Your Account</h2>
      <p class="text-center text-sm text-gray-600 mb-6">
        Enter your email and password to access your account
      </p>
      <div class="flex flex-col">
        <input
          type="email"
          class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 mt-2 mb-4"
          placeholder="Email"
        />
        <input
          type="password"
          class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 mt-2 mb-4"
          placeholder="Password"
        />
      </div>
      <div class="flex justify-center mt-6 text-center">
        <p class="text-sm text-gray-400 font-light">
          {{ error() }}
        </p>
      </div>
      <div class="flex justify-center text-center">
        <button pButton class="" (click)="signIn()">Sign In</button>
      </div>
      or
      <button pButton (click)="signInWithGoogle()">
        <i class="pi pi-google" pButtonIcon></i>
        <span pButtonLabel>Sign in with Google</span>
      </button>
      <div class="mt-6 text-center text-sm text-gray-600">
        <p class="text-sm text-center text-gray-400">
          Don't have an account? <a href="#" class="underline">Register</a>
        </p>
      </div>
    </div>
  </p-card>
</div>
