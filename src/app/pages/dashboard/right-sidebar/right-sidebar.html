<div class="h-full flex flex-col overflow-hidden">
  <!-- Header with close button -->
  <div class="p-4 border-b border-gray-100 flex items-center justify-between">
    <h2 class="text-lg font-semibold text-gray-800">Quick Tools</h2>
    <button 
      pButton 
      pRipple
      icon="pi pi-times"
      class="p-button-text p-button-rounded"
      (click)="togglePane()"
      title="Close pane">
    </button>
  </div>

  <!-- Content Area -->
  <div class="flex-1 overflow-y-auto p-4">
    <!-- Grid of feature cards -->
    <div class="grid grid-cols-2 gap-4">
      <div *ngFor="let feature of features" class="col-span-2 sm:col-span-1">
        <p-card [style]="{ 'margin-bottom': '0' }">
          <div class="flex flex-col items-center text-center p-2">
            <!-- Icon Container -->
            <div class="w-12 h-12 rounded-full flex items-center justify-center mb-3"
                 [ngClass]="feature.color">
              <i [class]="feature.icon + ' text-xl'"></i>
            </div>
            
            <!-- Title -->
            <h3 class="font-semibold text-gray-800 mb-1">{{ feature.title }}</h3>
            
            <!-- Description -->
            <p class="text-sm text-gray-600 mb-3">{{ feature.description }}</p>
            
            <!-- Action Button -->
            <button 
              pButton 
              pRipple
              label="Open"
              class="p-button-text p-button-sm w-full"
              [ngClass]="{
                'text-purple-600': feature.title === 'Studio',
                'text-blue-600': feature.title === 'Overview',
                'text-green-600': feature.title === 'Quiz',
                'text-amber-600': feature.title === 'Guide',
                'text-pink-600': feature.title === 'Community',
                'text-gray-600': feature.title === 'Settings'
              }">
            </button>
          </div>
        </p-card>
      </div>
    </div>

    <!-- Recent Activity Section -->
    <div class="mt-8">
      <h3 class="font-semibold text-gray-800 mb-4">Recent Activity</h3>
      <div class="space-y-3">
        <div class="flex items-start space-x-3">
          <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center flex-shrink-0">
            <i class="pi pi-code text-blue-600 text-sm"></i>
          </div>
          <div>
            <p class="text-sm font-medium">Project updated</p>
            <p class="text-xs text-gray-500">2 hours ago</p>
          </div>
        </div>
        <div class="flex items-start space-x-3">
          <div class="w-8 h-8 rounded-full bg-green-100 flex items-center justify-center flex-shrink-0">
            <i class="pi pi-check text-green-600 text-sm"></i>
          </div>
          <div>
            <p class="text-sm font-medium">Task completed</p>
            <p class="text-xs text-gray-500">Yesterday</p>
          </div>
        </div>
        <div class="flex items-start space-x-3">
          <div class="w-8 h-8 rounded-full bg-amber-100 flex items-center justify-center flex-shrink-0">
            <i class="pi pi-comment text-amber-600 text-sm"></i>
          </div>
          <div>
            <p class="text-sm font-medium">New comment</p>
            <p class="text-xs text-gray-500">2 days ago</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="p-4 border-t border-gray-100">
    <button 
      pButton 
      pRipple
      icon="pi pi-plus"
      label="Add Widget"
      class="p-button-outlined w-full"
      styleClass="p-button-sm">
    </button>
  </div>
</div>
