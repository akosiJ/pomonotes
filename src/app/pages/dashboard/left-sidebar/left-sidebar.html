<div class="flex flex-col overflow-auto left-sidebar-container  h-full border border-gray-100 rounded-lg">
  <!-- Top Group: Search and Collapse Toggle on same row -->
  <div class="p-4 border-b border-gray-100" *ngIf="!isCollapsed">
    <div class="flex items-center space-x-2">
      <!-- Search Bar -->
      <div class="flex-1 relative">
        <i class="pi pi-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
        <input 
          type="text" 
          pInputText
          placeholder="Search..."
          class="w-full pl-10 pr-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
      </div>
      <!-- Collapse/Expand Toggle Button -->
      <button 
        pButton 
        pRipple
        [icon]="isCollapsed ? 'pi pi-chevron-right' : 'pi pi-chevron-left'"
        class="p-button-text p-button-rounded p-button-sm flex-shrink-0"
        (click)="togglePane()"
        [title]="isCollapsed ? 'Expand' : 'Collapse'">
      </button>
    </div>
  </div>

  <!-- Collapse Toggle Only (when collapsed) -->
  <div class="p-2 border-b border-gray-100 flex justify-end" *ngIf="isCollapsed">
    <button 
      pButton 
      pRipple
      [icon]="isCollapsed ? 'pi pi-chevron-right' : 'pi pi-chevron-left'"
      class="p-button-text p-button-rounded p-button-sm"
      (click)="togglePane()"
      [title]="isCollapsed ? 'Expand' : 'Collapse'">
    </button>
  </div>

  <!-- Middle Group: Navigation -->
  <nav class="flex-1 overflow-y-auto p-2 mb-4">
    <ul class="space-y-1">
      <li *ngFor="let item of navItems">
        <a 
          [href]="'#'" 
          class="flex items-center px-4 py-3 rounded-lg hover:bg-gray-100 transition-colors"
          [class.bg-blue-50]="item.active"
          [class.text-blue-600]="item.active">
          <i [class]="item.icon + ' text-lg'"></i>
          
          <!-- Label (hidden when collapsed) -->
          <span 
            class="ml-3 font-medium text-sm"
            *ngIf="!isCollapsed">
            {{ item.label }}
          </span>
          
          
          <!-- Badge for active item -->
          <!-- <span 
            *ngIf="item.active && !isCollapsed"
            class="ml-auto bg-blue-600 text-white text-xs px-2 py-1 rounded-full">
            5
          </span> -->
        </a>
      </li>
    </ul>
  </nav>

  <!-- Bottom Group: Theme Toggle and User Info (positions switched) -->
  <div class="border-t border-gray-100 mt-auto" *ngIf="!isCollapsed">
    <!-- Theme Toggle Button -->
    <div class="p-4 border-b border-gray-100">
      <!-- todo : fix, detect the theme change -->
      <button
        pButton
        pRipple
        [icon]="true ? 'pi pi-sun' : 'pi pi-moon'"
        class="w-full p-button-text p-button-sm"
        (click)="toggleTheme()"
        [title]="true ? 'Switch to Light Theme' : 'Switch to Dark Theme'">
        <span class="ml-2">
        </span>
      </button>
    </div>

    <!-- User Info -->
    <div class="p-4">
      <div class="flex items-center">
        <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center">
          <i class="pi pi-user text-blue-600"></i>
        </div>
        <div class="ml-3">
          <p class="font-medium text-sm text-gray-800">John Developer</p>
          <p class="text-xs text-gray-500">Admin</p>
        </div>
      </div>
    </div>
  </div>
</div>
